
# GPIO and button
CONFIG_GPIO=y

# Accelerometer over I2C
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LIS2DH=y

# 50 Hz sampling, high-resolution mode
CONFIG_LIS2DH_ODR_4=y
CONFIG_LIS2DH_OPER_MODE_HIGH_RES=y
CONFIG_LIS2DH_ACCEL_RANGE_4G=y
CONFIG_LIS2DH_BLOCK_DATA_UPDATE=y

# Serial console to Mac
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
